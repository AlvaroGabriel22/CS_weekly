[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    asyncio: async test
    integration: integration test
    unit: unit test
    db: database test
    slow: slow test (deselect with -m "not slow")
