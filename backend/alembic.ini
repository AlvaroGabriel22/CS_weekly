# Alembic Configuration

# Path to migration files
script_location = app/db/migrations

# Path to SQLAlchemy database URL
sqlalchemy.url = sqlite:///./qwi.db

# Use template or custom environment
version_path_separator = :
version_locations = %(here)s/app/db/migrations/versions

# Logging configuration
[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
