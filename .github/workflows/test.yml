name: Tests & Quality

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          cd backend
          black --check app/ || true
          ruff check app/ || true
      - name: Tests
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=term-missing
      - name: Coverage
        uses: codecov/codecov-action@v3
        if: always()

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint || true
      - name: Type check
        run: cd frontend && npm run type-check || true
      - name: Tests
        run: cd frontend && npm run test:run || true
      - name: Build
        run: cd frontend && npm run build
